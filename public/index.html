<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="description" content="DC Siborong Borong - History Paket, Scan QR, Cek Resi SPX & Stok" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DC Siborong" />
  <title>DC Siborong Borong</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --blue: #1d4ed8;
      --blue-dark: #1e3a8a;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --radius: 14px;
      --nav-h: 58px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    input, select, textarea, button {
      font-size: 16px !important;
      font-family: inherit;
    }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }
    button { cursor: pointer; }
    img { max-width: 100%; height: auto; }

    .badge-received     { background: #dbeafe; color: #1e40af; }
    .badge-packed       { background: #fef3c7; color: #92400e; }
    .badge-transporting { background: #e0e7ff; color: #3730a3; }
    .badge-transported  { background: #d1fae5; color: #065f46; }
    .badge-arrival      { background: #fce7f3; color: #9d174d; }

    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding-top: max(8px, env(safe-area-inset-top));
      background: linear-gradient(180deg, var(--blue-dark) 0%, var(--blue) 100%);
      color: #fff;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
    }
    .app-header .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 10px 14px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .app-header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }
    .app-header .sub {
      margin: 2px 0 0;
      font-size: 11px;
      color: #bfdbfe;
    }
    .app-header .user-box {
      text-align: right;
      flex-shrink: 0;
      max-width: 42%;
    }
    .app-header .user-box p {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main-wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 12px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2, .section-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-primary {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      min-height: 44px;
      padding: 10px 14px;
      font-weight: 600;
    }
    .btn-ghost {
      background: #f1f5f9;
      color: #334155;
      border: none;
      border-radius: 12px;
      min-height: 44px;
      padding: 10px 12px;
      font-weight: 600;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-row > * { flex: 1; min-width: 0; }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      max-width: 480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
    }
    .bottom-nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 52px;
      padding: 4px 2px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1.05;
    }
    .bottom-nav button .ico {
      font-size: 18px;
      line-height: 1;
    }
    .bottom-nav button.active {
      color: var(--blue);
      background: #eff6ff;
    }

    #reader { border-radius: 12px; overflow: hidden; background: #0f172a; }
    #reader video { border-radius: 12px; width: 100% !important; }
    .photo-preview {
      width: 72px;
      height: 72px;
      max-height: none;
      border-radius: 10px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--line);
    }
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.92);
      align-items: center;
      justify-content: center;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
    }
    #lightbox.show { display: flex; }
    #lightbox img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
    }
    #lightbox .close-btn {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 999px;
      width: 40px;
      height: 40px;
      font-size: 22px;
      font-weight: bold;
    }
    #pin-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0,0,0,0.55);
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    #pin-modal.show { display: flex; }
    #pin-modal .sheet {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .timeline-item {
      border-left: 2px solid #bfdbfe;
      padding-left: 12px;
      margin-left: 6px;
      padding-bottom: 10px;
    }
    .timeline-item:last-child { border-left-color: transparent; }

    .text-muted { color: var(--muted); }
    .gap-tight > * + * { margin-top: 10px; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #dbeafe;
    }

    @media (min-width: 480px) {
      #pin-modal { align-items: center; padding: 16px; }
      #pin-modal .sheet { border-radius: 16px; }
    }

    /* ===== Chatbot Internal ===== */
    #chatbot-fab {
      position: fixed;
      right: 16px;
      bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
      z-index: 50;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      color: #fff;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(29, 78, 216, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #chatbot-fab:active { transform: scale(0.94); }
    #chatbot-fab.has-unread::after {
      content: '';
      position: absolute;
      top: 6px; right: 6px;
      width: 12px; height: 12px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    #chatbot-panel {
      display: none;
      position: fixed;
      right: 12px;
      bottom: calc(var(--nav-h) + 80px + env(safe-area-inset-bottom));
      z-index: 55;
      width: min(380px, calc(100vw - 24px));
      height: min(520px, calc(100vh - 160px));
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(15, 23, 42, 0.22);
      border: 1px solid #e2e8f0;
      flex-direction: column;
      overflow: hidden;
    }
    #chatbot-panel.open { display: flex; }
    #chatbot-header {
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #chatbot-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }
    #chatbot-header .sub {
      margin: 2px 0 0;
      font-size: 10px;
      color: #bfdbfe;
    }
    #chatbot-header .actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #chatbot-header button {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-msg {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }
    .chat-msg.bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
      color: #0f172a;
    }
    .chat-msg.user {
      align-self: flex-end;
      background: #1d4ed8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 10px;
      opacity: 0.7;
    }
    .chat-msg.bot .msg-meta { color: #64748b; }
    .chat-msg.user .msg-meta { color: #bfdbfe; }
    .chat-msg .speak-btn {
      background: #eff6ff;
      border: 1px solid #dbeafe;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .chat-quick {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px 8px;
      background: #f8fafc;
    }
    .chat-quick button {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #1e40af;
    }
    #chatbot-input-area {
      border-top: 1px solid #e2e8f0;
      padding: 10px;
      background: #fff;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chatbot-input {
      flex: 1;
      min-height: 42px;
      max-height: 90px;
      resize: none;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px !important;
      line-height: 1.3;
    }
    #chatbot-send, #chatbot-mic {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #1d4ed8;
      color: #fff;
      font-size: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #chatbot-mic {
      background: #0f172a;
    }
    #chatbot-mic.listening {
      background: #dc2626;
      animation: pulse-mic 1s infinite;
    }
    @keyframes pulse-mic {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
    }
    .chat-typing {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 12px;
      color: #64748b;
    }
    .chat-typing span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      margin: 0 1px;
      animation: typing-dot 1.2s infinite ease-in-out;
    }
    .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
    .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-dot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen">

  <header class="app-header">
    <div class="wrap">
      <div class="min-w-0">
        <h1>DC Siborong Borong</h1>
        <p class="sub">History · Scan · Cek Resi · Stok · Asisten</p>
      </div>
      <div class="user-box">
        <p class="text-[10px] text-blue-200" id="user-email-label">Powered by</p>
        <p class="text-[11px] font-medium" id="user-name-label">Amos rcpdroid ~86</p>
        <button type="button" id="btn-logout" onclick="logoutCloud()" class="hidden text-[10px] text-blue-100 underline mt-0.5">Keluar</button>
      </div>
    </div>
  </header>

  <main class="main-wrap max-w-lg mx-auto px-3 pt-3">
    <p class="text-center text-sm text-gray-500 py-8">Memuat aplikasi... Jika halaman ini tetap, refresh browser.</p>
  </main>

  <!-- Chatbot will be fully injected - SEE NOTE -->
  <button type="button" id="chatbot-fab" onclick="toggleChatbot()" title="Asisten DC">💬</button>
  <div id="chatbot-panel" aria-live="polite">
    <div id="chatbot-header">
      <div>
        <h3>Asisten DC Siborong</h3>
        <p class="sub">Cek resi · Stok · History · Suara</p>
      </div>
      <div class="actions">
        <button type="button" id="chatbot-voice-toggle" onclick="toggleAutoSpeak()" title="Suara otomatis">🔊</button>
        <button type="button" onclick="clearChatbot()" title="Hapus chat">🗑️</button>
        <button type="button" onclick="toggleChatbot()" title="Tutup">✕</button>
      </div>
    </div>
    <div id="chatbot-messages"></div>
    <div class="chat-quick" id="chatbot-quick">
      <button type="button" onclick="chatQuick('bantuan')">Bantuan</button>
      <button type="button" onclick="chatQuick('cek resi')">Cek Resi</button>
      <button type="button" onclick="chatQuick('ringkas stok')">Stok</button>
      <button type="button" onclick="chatQuick('laporan hari ini')">Laporan</button>
    </div>
    <div id="chatbot-input-area">
      <button type="button" id="chatbot-mic" onclick="toggleVoiceInput()" title="Bicara">🎤</button>
      <textarea id="chatbot-input" rows="1" placeholder="Tulis perintah... mis: cek SPX123" onkeydown="chatInputKey(event)"></textarea>
      <button type="button" id="chatbot-send" onclick="sendChatMessage()" title="Kirim">➤</button>
    </div>
  </div>

  <script>
    alert('Push parsial - jangan gunakan file ini. Gunakan versi lengkap.');
  </script>
</body>
</html>
